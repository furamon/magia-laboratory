# Docker Compose 設定
# Astro 静的サイト + Webhookサーバーの2コンテナ構成
# name を固定することで、どのディレクトリから実行されてもプロジェクト名が一致する
name: magia-laboratory

services:
  # Astro サイト本体（SSR standalone / Keystatic 対応）
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - KEYSTATIC_GITHUB_CLIENT_ID=${KEYSTATIC_GITHUB_CLIENT_ID}
      - KEYSTATIC_GITHUB_CLIENT_SECRET=${KEYSTATIC_GITHUB_CLIENT_SECRET}
      - KEYSTATIC_SECRET=${KEYSTATIC_SECRET}
      - PUBLIC_KEYSTATIC_GITHUB_APP_SLUG=${PUBLIC_KEYSTATIC_GITHUB_APP_SLUG}
    ports:
      - "${APP_PORT:-4321}:4321"
    restart: unless-stopped

  # GitHub Webhook受信サーバー
  webhook:
    build:
      context: .
      dockerfile: Dockerfile.webhook
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app
    env_file:
      - .env
    environment:
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - BUILD_SCRIPT_PATH=/webhook/deploy.sh
      - PORT=3001
    ports:
      - "${WEBHOOK_PORT:-3001}:3001"
    restart: unless-stopped
